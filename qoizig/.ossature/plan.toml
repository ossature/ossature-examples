[[task]]
id = "006"
spec = "QOI_CODEC"
title = "PPM/PAM Image Format Reader & Writer"
description = "Implement readers and writers for PPM P6 (binary RGB) and PAM P7 (RGBA) image formats. The PPM reader parses the P6 header (magic, width, height, maxval) and extracts raw RGB pixel data. The PAM reader parses the P7 header (WIDTH, HEIGHT, DEPTH, MAXVAL, TUPLTYPE) and extracts raw RGBA pixel data. Writers produce valid PPM P6 or PAM P7 files from raw pixel data. Include validation for malformed headers and size mismatches. The format choice for decode output is determined by the QOI header's channel count (3=PPM, 4=PAM)."
outputs = [
    "src/image_io.zig",
]
