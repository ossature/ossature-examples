[[task]]
id = "003"
spec = "QOI_CODEC"
title = "QOI Encoder Implementation"
description = "Implement the QOI encoder that takes raw pixel data (RGB or RGBA), a width, height, and channel count, and produces a complete QOI byte stream. The encoder must write the 14-byte header (Big Endian width/height), apply the chunk compression algorithm (QOI_OP_INDEX, QOI_OP_DIFF, QOI_OP_LUMA, QOI_OP_RUN, QOI_OP_RGB, QOI_OP_RGBA), maintain the 64-entry running pixel index, and append the 8-byte end marker. Uses unsigned 8-bit wraparound arithmetic for channel differences."
outputs = [
    "src/encoder.zig",
]
