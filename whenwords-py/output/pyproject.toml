[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whenwords-py"
version = "0.0.1"
description = "Pure, side-effect-free utility functions for transforming timestamps and durations into human-friendly strings and parsing casual temporal inputs."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/whenwords"]


[tool.pytest.ini_options]
pythonpath = ["src"]
